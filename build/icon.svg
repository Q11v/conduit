<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7d6bff"/>
      <stop offset=".55" stop-color="#4a33d6"/>
      <stop offset="1" stop-color="#1e1170"/>
    </linearGradient>
    <radialGradient id="light" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".82" cy=".62" r=".55">
      <stop offset="0" stop-color="#5ee8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5ee8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e6e1ff"/>
      <stop offset="1" stop-color="#b9adff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fdff"/>
      <stop offset="1" stop-color="#6fe3f7"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0630" flood-opacity=".5"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#120a4a" flood-opacity=".55"/>
    </filter>
    <filter id="neon" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#light)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <path d="M612.6 375.8 A205 205 0 1 0 612.6 648.2" fill="none" stroke="url(#ring)" stroke-width="124" stroke-linecap="round" filter="url(#lift)"/>
  <path d="M325 420 A205 205 0 0 1 560 326" fill="none" stroke="url(#gloss)" stroke-width="26" stroke-linecap="round" opacity=".55"/>

  <g filter="url(#neon)">
    <rect x="636" y="482" width="60" height="60" rx="18" fill="url(#packet)"/>
    <rect x="724" y="489" width="46" height="46" rx="14" fill="url(#packet)" opacity=".85"/>
    <rect x="796" y="496" width="32" height="32" rx="10" fill="url(#packet)" opacity=".65"/>
  </g>
</svg>
